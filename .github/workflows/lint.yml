name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n (alle Scripts)
        run: |
          bash -n install/hyperframes-suite.sh
          echo OK
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./install
          severity: warning
      - name: node --check (Job-UI)
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/job-server.js
